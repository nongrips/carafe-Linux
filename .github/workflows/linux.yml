name: Linux build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/hacbrewpack/**'
      - 'docker/**'
      - 'compose.yaml'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - run: npm ci
        working-directory: app
      - name: Check and test
        run: npm run check
        working-directory: app
      - name: Build Linux packages
        run: npm run build:linux
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carafe-linux-x86_64
          path: |
            app/target/release/bundle/deb/*.deb
            app/target/release/bundle/rpm/*.rpm
            app/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
